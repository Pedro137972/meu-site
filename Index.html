function irParaDesafio() {
  state.desafio = null;
  state.view = "desafio-escolher-jogador";
  render();
}

function viewDesafioEscolherJogador() {
  return `
    <div class="card"><p class="lead">Desafio Lendário: escolha quem você vai controlar (não afeta nenhuma carreira, só pra testar matchups).</p></div>
    ${renderListaMcsPorEstado(null, "escolherDesafioJogador")}
    <button class="btn secondary" onclick="voltarMenu()">Cancelar</button>
  `;
}

function escolherDesafioJogador(id) {
  const mc = HISTORICAL_MCS.find((m) => m.id === id);
  if (!mc) return;
  state.desafio = { jogador: opcaoComoOponente(mc), rival: null, resultado: null };
  state.view = "desafio-escolher-rival";
  render();
}

function viewDesafioEscolherRival() {
  return `
    <div class="card"><p class="lead">Agora escolha o adversário de ${state.desafio.jogador.nome}.</p></div>
    ${renderListaMcsPorEstado(state.desafio.jogador.id, "escolherDesafioRival")}
    <button class="btn secondary" onclick="irParaDesafio()">Trocar meu MC</button>
  `;
}

function escolherDesafioRival(id) {
  const mc = HISTORICAL_MCS.find((m) => m.id === id);
  if (!mc) return;
  state.desafio.rival = opcaoComoOponente(mc);
  state.desafio.resultado = null;
  state.view = "desafio-batalha";
  render();
}

function executarDesafioBatalha() {
  const d = state.desafio;
  d.resultado = simularBatalha(d.jogador.ovr, d.rival.ovr);
  render();
}

function viewDesafioBatalha() {
  const d = state.desafio;
  const jogadorCls = d.resultado ? (d.resultado.vencedor === "jogador" ? "win" : "lose") : "you";
  const rivalCls = d.resultado ? (d.resultado.vencedor === "adversario" ? "win" : "lose") : "";
  let resultadoHtml;
  if (d.resultado) {
    const venceu = d.resultado.vencedor === "jogador";
    const pips = d.resultado.rounds.map((r) => `<span class="${r === "V" ? "v" : "d"}">${r}</span>`).join("");
    resultadoHtml = `
      <div class="card">
        <div class="score-line ${venceu ? "win" : "lose"}">${d.resultado.pWins} x ${d.resultado.oWins}</div>
        <div class="round-pips">${pips}</div>
        <p class="lead" style="text-align:center;">${d.jogador.nome} ${venceu ? "venceu" : "perdeu para"} ${d.rival.nome}</p>
      </div>
      <button class="btn" onclick="executarDesafioBatalha()">SIMULAR DE NOVO</button>
      <button class="btn secondary" onclick="irParaDesafio()">ESCOLHER OUTRO MC</button>
    `;
  } else {
    resultadoHtml = `<button class="btn" onclick="executarDesafioBatalha()">SIMULAR BATALHA</button>`;
  }
  return `
    <div class="stage-label">Desafio Lendário</div>
    ${renderMcCard(d.jogador, jogadorCls, false)}
    <div class="versus">VERSUS</div>
    ${renderMcCard(d.rival, rivalCls, false)}
    ${resultadoHtml}
    <button class="btn secondary" onclick="voltarMenu()">Voltar ao menu</button>
  `;
}

// ---------------------------------------------------------
// Modo 2 Jogadores — cada um escolhe um MC e batalham entre si
// ---------------------------------------------------------

const TURNOS_DRAFT = [
  { time: 1, qtd: 1 }, { time: 2, qtd: 2 }, { time: 1, qtd: 2 }, { time: 2, qtd: 2 },
  { time: 1, qtd: 2 }, { time: 2, qtd: 2 }, { time: 1, qtd: 2 }, { time: 2, qtd: 2 },
  { time: 1, qtd: 1 },
];

function irParaDuelo() {
  state.duelo = null;
  state.view = "duelo-nomes-times";
  render();
}

function viewDueloNomesTimes() {
  return `
    <div class="card">
      <h2>Modo 2 Jogadores — Draft</h2>
      <p class="lead">Cada time vai sortear levas de 8 MCs e escolher quem entra no time, até montar 8 cada.</p>
      <label class="field-label">Nome do Time 1</label>
      <input id="f-time-a" placeholder="Ex: Os Invictos" />
      <label class="field-label">Nome do Time 2</label>
      <input id="f-time-b" placeholder="Ex: Batalha Fatal" />
      <div id="f-erro-times" style="color:var(--red);font-size:0.8rem;margin-top:4px;"></div>
    </div>
    <button class="btn" onclick="confirmarNomesTimes()">COMEÇAR DRAFT</button>
    <button class="btn secondary" onclick="voltarMenu()">Cancelar</button>
  `;
}

function confirmarNomesTimes() {
  const nomeA = document.getElementById("f-time-a").value.trim();
  const nomeB = document.getElementById("f-time-b").value.trim();
  if (!nomeA || !nomeB) {
    document.getElementById("f-erro-times").textContent = "Dá um nome pros dois times.";
    return;
  }
  state.duelo = {
    nomeTimeA: nomeA, nomeTimeB: nomeB,
    timeA: [], timeB: [],
    turnoAtual: 0, escolhidosNesseTurno: 0,
    poolFixo: [], idsDraftados: [],
    formato: null, resultado: null,
  };
  sortearPoolDraft();
  state.view = "duelo-draft";
  render();
}

// Sorteia os 16 MCs da partida UMA vez só — essa lista fica fixa o jogo inteiro,
// os dois times vão escolhendo dela até esgotar (8 picks cada).
function sortearPoolDraft() {
  const d = state.duelo;
  const poolCopia = [...HISTORICAL_MCS];
  const lote = [];
  for (let i = 0; i < 16 && poolCopia.length > 0; i++) {
    const idx = Math.floor(Math.random() * poolCopia.length);
    lote.push(poolCopia.splice(idx, 1)[0]);
  }
  d.poolFixo = lote;
}

function opcoesRestantesDraft() {
  const d = state.duelo;
  const usados = new Set(d.idsDraftados);
  return d.poolFixo.filter((m) => !usados.has(m.id));
}

function viewDueloDraft() {
  const d = state.duelo;
  const turno = TURNOS_DRAFT[d.turnoAtual];
  const nomeTime = turno.time === 1 ? d.nomeTimeA : d.nomeTimeB;
  const faltam = turno.qtd - d.escolhidosNesseTurno;
  const opcoes = opcoesRestantesDraft().map((m) => `
    <div class="option-card" onclick="escolherNoDraft('${m.id}')">
      <span class="opt-val">OVR ${m.ovr}</span>
      <span class="opt-name">${m.nome}</span><br/>
      <span style="font-size:0.68rem;color:var(--paper-dim)">${m.estado}</span>
    </div>
  `).join("");
  return `
    <div class="stage-label">Draft — Turno ${d.turnoAtual + 1}/${TURNOS_DRAFT.length}</div>
    <div class="card dark">
      <h2>Vez de: ${nomeTime}</h2>
      <p class="lead">Escolha ${faltam} MC${faltam > 1 ? "s" : ""} da lista (fixa, os 16 são sempre os mesmos na partida).</p>
    </div>
    <div class="grid">${opcoes}</div>
    <div class="card">
      <p class="lead" style="font-size:0.8rem;">${d.nomeTimeA}: ${d.timeA.length}/8 — ${d.nomeTimeB}: ${d.timeB.length}/8</p>
    </div>
  `;
}

function escolherNoDraft(id) {
  const d = state.duelo;
  const turno = TURNOS_DRAFT[d.turnoAtual];
  const mc = d.poolFixo.find((m) => m.id === id);
  if (!mc || d.idsDraftados.includes(id)) return;
  const wrapped = opcaoComoOponente(mc);
  if (turno.time === 1) d.timeA.push(wrapped); else d.timeB.push(wrapped);
  d.idsDraftados.push(mc.id);
  d.escolhidosNesseTurno++;

  if (d.escolhidosNesseTurno >= turno.qtd) {
    d.turnoAtual++;
    d.escolhidosNesseTurno = 0;
    if (d.turnoAtual >= TURNOS_DRAFT.length) {
      state.view = "duelo-formato";
      render();
      return;
    }
  }
  render();
}

function viewDueloFormato() {
  const d = state.duelo;
  return `
    <div class="card">
      <h2>Draft completo!</h2>
      <p class="lead"><b>${d.nomeTimeA}</b>: ${d.timeA.map((m) => m.nome).join(", ")}</p>
      <p class="lead"><b>${d.nomeTimeB}</b>: ${d.timeB.map((m) => m.nome).join(", ")}</p>
    </div>
    <div class="card dark">
      <h2>Escolha o formato da batalha</h2>
      <p class="lead">Até o último homem: os times mandam um de cada vez — quem perde sai, e o técnico escolhe o próximo, até acabar um lado. Normal: cada rodada os dois times escolhem quem entra, 8 rodadas, ganha quem tiver mais vitórias.</p>
    </div>
    <button class="btn" onclick="rodarDuelo('ultimo-homem')">ATÉ O ÚLTIMO HOMEM</button>
    <button class="btn secondary" onclick="rodarDuelo('normal')">NORMAL (1 a 1)</button>
  `;
}

function registrarDesempenho(desempenho, vencedorId, vencedorNome, dominante) {
  if (!desempenho[vencedorId]) desempenho[vencedorId] = { nome: vencedorNome, vitorias: 0, dominantes: 0 };
  desempenho[vencedorId].vitorias++;
  if (dominante) desempenho[vencedorId].dominantes++;
}

function calcularMvp(desempenho) {
  const entradas = Object.values(desempenho);
  if (entradas.length === 0) return null;
  entradas.sort((a, b) => (b.vitorias * 10 + b.dominantes) - (a.vitorias * 10 + a.dominantes));
  return entradas[0];
}

function rodarDuelo(formato) {
  const d = state.duelo;
  d.formato = formato;
  d.restantesA = [...d.timeA];
  d.restantesB = [...d.timeB];
  d.atualA = null;
  d.atualB = null;
  d.log = [];
  d.desempenho = {};
  d.vitoriasA = 0;
  d.vitoriasB = 0;
  d.turnoNormal = 0;
  d.resultadoBatalhaAtual = null;
  d.resultado = null;
  state.view = "duelo-batalha-interativa";
  render();
}

function escolherLutadorA(id) {
  const d = state.duelo;
  const idx = d.restantesA.findIndex((m) => m.id === id);
  if (idx === -1) return;
  d.atualA = d.restantesA.splice(idx, 1)[0];
  render();
}

function escolherLutadorB(id) {
  const d = state.duelo;
  const idx = d.restantesB.findIndex((m) => m.id === id);
  if (idx === -1) return;
  d.atualB = d.restantesB.splice(idx, 1)[0];
  render();
}

function executarBatalhaDuelo() {
  const d = state.duelo;
  const r = simularBatalha(d.atualA.ovr, d.atualB.ovr);
  const venceuA = r.vencedor === "jogador";
  const dominante = r.pWins === 0 || r.oWins === 0;
  const vencedorNome = venceuA ? d.atualA.nome : d.atualB.nome;
  registrarDesempenho(d.desempenho, venceuA ? d.atualA.id : d.atualB.id, vencedorNome, dominante);
  if (venceuA) d.vitoriasA++; else d.vitoriasB++;
  d.log.push({ a: d.atualA.nome, b: d.atualB.nome, placar: `${r.pWins}x${r.oWins}`, vencedor: vencedorNome });
  d.resultadoBatalhaAtual = { venceuA, placar: `${r.pWins}x${r.oWins}` };
  render();
}

function continuarDuelo() {
  const d = state.duelo;
  d.resultadoBatalhaAtual = null;
  if (d.formato === "ultimo-homem") {
    if (d.log[d.log.length - 1].vencedor === d.atualA.nome) {
      d.atualB = null; // perdeu, sai; o técnico escolhe o próximo
    } else {
      d.atualA = null;
    }
    if (!d.atualA && d.restantesA.length === 0) { finalizarDuelo("B"); return; }
    if (!d.atualB && d.restantesB.length === 0) { finalizarDuelo("A"); return; }
  } else {
    d.atualA = null;
    d.atualB = null;
    d.turnoNormal++;
    if (d.turnoNormal >= 8) { finalizarDuelo(null); return; }
  }
  render();
}

function finalizarDuelo(timeVencedorForcado) {
  const d = state.duelo;
  const timeVencedor = timeVencedorForcado || (d.vitoriasA > d.vitoriasB ? "A" : d.vitoriasB > d.vitoriasA ? "B" : "empate");
  d.resultado = { log: d.log, timeVencedor, mvp: calcularMvp(d.desempenho), vitoriasA: d.vitoriasA, vitoriasB: d.vitoriasB };
  state.view = "duelo-resultado";
  render();
}

function viewDueloBatalhaInterativa() {
  const d = state.duelo;

  if (d.resultadoBatalhaAtual) {
    const venceuA = d.resultadoBatalhaAtual.venceuA;
    return `
      <div class="stage-label">${d.formato === "ultimo-homem" ? "Até o último homem" : "Normal"}</div>
      ${renderMcCard(d.atualA, venceuA ? "win" : "lose", false)}
      <div class="versus">VERSUS</div>
      ${renderMcCard(d.atualB, venceuA ? "lose" : "win", false)}
      <div class="card">
        <div class="score-line ${venceuA ? "win" : "lose"}">${d.resultadoBatalhaAtual.placar}</div>
        <p class="lead" style="text-align:center;">${venceuA ? d.atualA.nome : d.atualB.nome} venceu</p>
        <button class="btn" onclick="continuarDuelo()">CONTINUAR</button>
      </div>
    `;
  }

  if (!d.atualA) {
    if (d.restantesA.length === 0) { finalizarDuelo("B"); return ""; }
    const opcoes = d.restantesA.map((m) => `<div class="option-card" onclick="escolherLutadorA('${m.id}')"><span class="opt-val">OVR ${m.ovr}</span><span class="opt-name">${m.nome}</span></div>`).join("");
    return `
      <div class="stage-label">${d.nomeTimeA}: escolha quem entra</div>
      <div class="grid">${opcoes}</div>
    `;
  }
  if (!d.atualB) {
    if (d.restantesB.length === 0) { finalizarDuelo("A"); return ""; }
    const opcoes = d.restantesB.map((m) => `<div class="option-card" onclick="escolherLutadorB('${m.id}')"><span class="opt-val">OVR ${m.ovr}</span><span class="opt-name">${m.nome}</span></div>`).join("");
    return `
      <div class="stage-label">${d.nomeTimeB}: escolha quem entra</div>
      <div class="grid">${opcoes}</div>
    `;
  }

  return `
    <div class="stage-label">${d.formato === "ultimo-homem" ? "Até o último homem" : "Normal"} — ${d.nomeTimeA} vs ${d.nomeTimeB}</div>
    ${renderMcCard(d.atualA, "you", false)}
    <div class="versus">VERSUS</div>
    ${renderMcCard(d.atualB, "", false)}
    <button class="btn" onclick="executarBatalhaDuelo()">SIMULAR BATALHA</button>
  `;
}

function viewDueloResultado() {
  const d = state.duelo;
  const r = d.resultado;
  const nomeVencedor = r.timeVencedor === "A" ? d.nomeTimeA : r.timeVencedor === "B" ? d.nomeTimeB : "Empate";
  const logHtml = r.log.map((b) => `<li>${b.a} ${b.placar.replace("x", " x ")} ${b.b} — venceu: <b>${b.vencedor}</b></li>`).join("");
  return `
    <div class="card" style="border:2px solid var(--yellow);">
      <h2>🏆 ${nomeVencedor}</h2>
      ${r.mvp ? `<p class="lead">⭐ MVP do evento: <b>${r.mvp.nome}</b> (${r.mvp.vitorias} vitória${r.mvp.vitorias > 1 ? "s" : ""}${r.mvp.dominantes ? `, ${r.mvp.dominantes} por 2x0` : ""})</p>` : ""}
    </div>
    <div class="card dark">
      <h2>Batalhas (${d.formato === "ultimo-homem" ? "até o último homem" : "normal"})</h2>
      <ul class="plain">${logHtml}</ul>
    </div>
    <button class="btn" onclick="irParaDuelo()">NOVO DRAFT</button>
    <button class="btn secondary" onclick="voltarMenu()">Voltar ao menu</button>
  `;
}

function viewHistoricoNacional() {
  const rows = Object.keys(HISTORICAL_NATIONALS).sort().map((ano) => {
    const r = HISTORICAL_NATIONALS[ano];
    return `<div class="year-row"><span>${ano}</span><b>🏆 ${r.campeao} · 🥈 ${r.vice}</b></div>`;
  }).join("");
  return `
    <div class="card">
      <h2>Histórico Nacional</h2>
      <p class="lead">Resultados reais do Duelo de MCs Nacional. Esses dados nunca são alterados por nenhuma carreira simulada.</p>
      ${rows}
      <p class="disclaimer">Campeões e estados vêm das listas de Nacionais e Estaduais fornecidas. Confira o Banco de MCs pra ver todo mundo que passou por essas edições.</p>
    </div>
    <button class="btn secondary" onclick="voltarMenu()">Voltar</button>
  `;
}

function irParaAdminSenha() {
  state.view = "admin-senha";
  render();
}

function viewAdminSenha() {
  return `
    <div class="card">
      <h2>Editar banco de MCs</h2>
      <p class="lead">Essa área deixa ajustar os atributos de qualquer MC do banco.</p>
      <label class="field-label">Senha</label>
      <input id="f-senha-admin" type="password" placeholder="Senha" />
      <div id="f-erro-admin" style="color:var(--red);font-size:0.8rem;margin-top:4px;"></div>
    </div>
    <button class="btn" onclick="confirmarSenhaAdmin()">ENTRAR</button>
    <button class="btn secondary" onclick="voltarMenu()">Cancelar</button>
  `;
}

function confirmarSenhaAdmin() {
  const senha = document.getElementById("f-senha-admin").value;
  if (senha !== "123") {
    document.getElementById("f-erro-admin").textContent = "Senha incorreta.";
    return;
  }
  state.adminAutenticado = true;
  state.view = "admin-lista";
  render();
}

function viewAdminLista() {
  if (!state.adminAutenticado) { voltarMenu(); return ""; }
  const porEstado = {};
  HISTORICAL_MCS.forEach((m) => { (porEstado[m.estado] = porEstado[m.estado] || []).push(m); });
  const estados = Object.keys(porEstado).sort();
  const blocos = estados.map((uf) => {
    const linhas = porEstado[uf]
      .slice()
      .sort((a, b) => b.ovr - a.ovr)
      .map((m) => `
        <div class="option-card" onclick="abrirEdicaoMc('${m.id}')">
          <span class="opt-val">OVR ${m.ovr}</span>
          <span class="opt-name">${m.nome}</span>
        </div>
      `).join("");
    return `<div class="card dark"><h2>${uf}</h2><div class="grid">${linhas}</div></div>`;
  }).join("");
  return `
    <div class="card"><p class="lead">Toque num MC pra editar os atributos dele.</p></div>
    ${blocos}
    <button class="btn secondary" onclick="voltarMenu()">Sair do modo edição</button>
  `;
}

function abrirEdicaoMc(id) {
  if (!state.adminAutenticado) { voltarMenu(); return; }
  const mc = HISTORICAL_MCS.find((m) => m.id === id);
  if (!mc) return;
  state.mcEditando = mc;
  state.view = "admin-editar";
  render();
}

function viewAdminEditar() {
  if (!state.adminAutenticado || !state.mcEditando) { state.view = "admin-lista"; return viewAdminLista(); }
  const mc = state.mcEditando;
  const linhas = ATTRS.map((a) => `
    <label class="field-label">${a.label}</label>
    <input id="f-attr-${a.key}" value="${mc[a.key]}" />
  `).join("");
  return `
    <div class="card">
      <h2>${mc.nome} (${mc.estado})</h2>
      <p class="lead">OVR atual: ${mc.ovr}</p>
      ${linhas}
      <div id="f-erro-edicao" style="color:var(--red);font-size:0.8rem;margin-top:4px;"></div>
    </div>
    <button class="btn" onclick="salvarEdicaoMc()">SALVAR</button>
    <button class="btn secondary" onclick="state.view='admin-lista'; render();">Voltar sem salvar</button>
  `;
}

function salvarEdicaoMc() {
  const mc = state.mcEditando;
  const novos = {};
  for (const a of ATTRS) {
    const v = Number(document.getElementById(`f-attr-${a.key}`).value);
    if (!Number.isFinite(v) || v < 1 || v > 99) {
      document.getElementById("f-erro-edicao").textContent = "Cada atributo precisa ser um número de 1 a 99.";
      return;
    }
    novos[a.key] = v;
  }
  Object.assign(mc, novos);
  mc.ovr = Math.round(ATTRS.reduce((acc, a) => acc + mc[a.key], 0) / ATTRS.length);
  salvarOverrideMc(mc);
  state.view = "admin-lista";
  render();
}

function viewBancoMcs() {
  const rows = HISTORICAL_MCS.map((m) => `
    <div class="year-row"><span>${m.nome} (${m.estado})</span><b>OVR ${m.ovr}</b></div>
  `).join("");
  return `
    <div class="card">
      <h2>Banco de MCs históricos</h2>
      <p class="lead">${HISTORICAL_MCS.length} MCs reais que participaram de Nacionais (2017-2025) e/ou das Estaduais 2025 de CE, GO, PA, PE, RS e TO. Os atributos e o OVR vêm de uma fórmula determinística pra equilibrar as batalhas — não são uma avaliação oficial da habilidade de ninguém.</p>
      ${rows}
    </div>
    <button class="btn secondary" onclick="voltarMenu()">Voltar</button>
  `;
}

// ---------------------------------------------------------
// Init
// ---------------------------------------------------------

(async function init() {
  await carregarTodosSlots();
  await carregarOverridesMcs();
  render();
})();

</script>
